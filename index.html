<!DOCTYPE html>
<html>
<head>
  <title>Happy Valentine's Day ❤️</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #ffe6eb;
      padding: 50px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { color: #e63946; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Valentine's Day ❤️</h1>
    <p>
      My love,<br><br>
      Thank you for being in my life.<br>
      Every day with you is special.<br><br>
      — Your Name
    </p>
  </div>
</body>
</html>
